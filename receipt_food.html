<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt Makanan - CineFlix</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #6a11cb;
            --secondary-color: #2575fc;
            --dark-color: #1a1a2e;
            --light-color: #f8f9fa;
            --accent-color: #ff4d4d;
            --card-bg: rgba(255, 255, 255, 0.05);
            --success-color: #28a745;
        }
        
        body {
            background: linear-gradient(135deg, var(--dark-color), #16213e);
            color: var(--light-color);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
        }
        
        .navbar {
            background: rgba(26, 26, 46, 0.9) !important;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            padding: 15px 0;
        }
        
        .navbar-brand {
            font-weight: 700;
            font-size: 1.8rem;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .receipt-container {
            max-width: 600px;
            margin: 40px auto;
        }
        
        .receipt {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .receipt-header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            padding-bottom: 20px;
        }
        
        .receipt-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 25%;
            width: 50%;
            height: 3px;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            border-radius: 2px;
        }
        
        .receipt-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .receipt-subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
        }
        
        .receipt-details {
            margin-bottom: 30px;
        }
        
        .receipt-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .receipt-item:last-child {
            border-bottom: none;
        }
        
        .receipt-label {
            color: rgba(255, 255, 255, 0.7);
        }
        
        .receipt-value {
            font-weight: 500;
        }
        
        .receipt-total {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--light-color);
        }
        
        .divider {
            border-top: 1px dashed rgba(255, 255, 255, 0.2);
            margin: 25px 0;
        }
        
        .barcode-container {
            text-align: center;
            margin: 30px auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
        }
        
        .barcode {
            max-width: 100%;
            height: 80px;
        }
        
        .btn-primary {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            border: none;
            padding: 12px 30px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(106, 17, 203, 0.4);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            padding: 12px 30px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }
        
        .transaction-id {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            margin-top: 10px;
        }
        
        .status-success {
            color: var(--success-color);
            font-weight: 600;
        }

        .barcode-container {
            text-align: center;
            margin: 0 auto 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }

        .transaction-info {
            text-align: center;
            margin-bottom: 30px;
        }
        
        @media (max-width: 768px) {
            .receipt {
                padding: 20px;
            }
            
            .receipt-title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-film me-2"></i>CineFlix
            </a>
        </div>
    </nav>

    <div class="container receipt-container">
        <div class="receipt">
            <div class="receipt-header">
                <h1 class="receipt-title">CineTix</h1>
                <p class="receipt-subtitle">Terima Kasih Atas Pembelian Anda</p>
                <div class="barcode-container">
                    <svg id="barcode" class="barcode"></svg>
                </div>
                <p class="transaction-id">ID Transaksi: <span id="receipt-id"></span></p>
            </div>
            
            <div class="receipt-details">
                <h5 class="receipt-value"><strong id="receipt-package"></strong></h5>
                <p class="receipt-label" id="receipt-cinema"></p>
                
                <div class="divider"></div>
                
                <div class="receipt-item">
                    <span class="receipt-total">Total Pembayaran:</span>
                    <span class="receipt-total" id="receipt-total"></span>
                </div>
                
                <div class="divider"></div>
                
                <div class="receipt-item">
                    <span class="receipt-label">Metode Pembayaran:</span>
                    <span class="receipt-value" id="receipt-payment-method"></span>
                </div>
                <div class="receipt-item">
                    <span class="receipt-label">Status Pembayaran:</span>
                    <span class="status-success">Berhasil</span>
                </div>
                <div class="receipt-item">
                    <span class="receipt-label">Tanggal Transaksi:</span>
                    <span class="receipt-value" id="receipt-date"></span>
                </div>
            </div>
            
            <div class="text-center mt-4">
                <button class="btn btn-primary me-3" onclick="window.print()">
                    <i class="fas fa-print me-2"></i>Cetak Receipt
                </button>
                <a href="index.html" class="btn btn-secondary">
                    <i class="fas fa-home me-2"></i>Kembali ke Beranda
                </a>
            </div>
        </div>
    </div>

    <script>
        function loadReceiptData() {
            const receiptData = JSON.parse(localStorage.getItem('foodReceiptData'));
            if (receiptData) {
                const barcodeElement = document.getElementById('barcode');
                if (barcodeElement) {
                    JsBarcode(barcodeElement, receiptData.orderId, {
                        format: "CODE128",
                        lineColor: "#fff",
                        width: 3,
                        height: 60,
                        displayValue: false,
                        background: "transparent"
                    });
                }

                document.getElementById('receipt-id').textContent = receiptData.orderId;
                document.getElementById('receipt-package').textContent = receiptData.package;
                document.getElementById('receipt-cinema').textContent = `Lokasi Pengambilan: ${receiptData.cinema}`;
                document.getElementById('receipt-total').textContent = `Rp ${receiptData.totalPrice.toLocaleString('id-ID')}`;
                document.getElementById('receipt-payment-method').textContent = receiptData.paymentMethod;
                document.getElementById('receipt-date').textContent = receiptData.paymentDate;
            } else {
                alert('Data transaksi makanan tidak ditemukan');
                window.location.href = "index.html";
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            const userEmail = localStorage.getItem('userEmail');
            
            if (isLoggedIn && userEmail) {
                const username = userEmail.split('@')[0];
                document.getElementById('userNavItem').innerHTML = `<a class="nav-link text-white" href="#" onclick="showUserMenu()"></a>`;
            }
            
            loadReceiptData();
        });

        function showUserMenu() {
            alert("Untuk melihat menu user, silakan login terlebih dahulu dari halaman utama");
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
